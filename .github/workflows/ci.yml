name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check abkit tests scripts
      - run: mypy abkit
      - run: pytest -q --cov=abkit --cov-fail-under=85
      - run: python scripts/sync_report.py --check
      - run: abkit samplesize 0.10 0.05
      - run: abkit analyze tests/fixtures/csv/conversion_per_user.csv
      - run: abkit simulate --quick --out /tmp/q.json
      - run: python scripts/check_archive.py
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: webapp/playwright-report
          retention-days: 7
