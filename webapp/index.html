<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>abkit — experimentation platform</title>
    <meta name="description" content="A/B-test dashboard, experiment wizard, sample-size planning, sequential results with confidence intervals, SRM guardrails, CUPED variance reduction and a ranking-metrics playground. Runs entirely in your browser." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta property="og:title" content="abkit — experimentation platform" />
    <meta property="og:description" content="Plan, run and read A/B tests with power analysis, SRM guardrails and CUPED — in the browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abkit.vercel.app/" />
    <meta property="og:image" content="https://abkit.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("abkit-theme");
          var dark = t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = dark ? "#17171c" : "#f7f7f9";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
