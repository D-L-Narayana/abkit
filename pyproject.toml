[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "1.1.0"
description = "A/B-testing and search-ranking evaluation toolkit for travel experiments: z/t tests, sample size and power, SRM, CUPED, delta-method relative-lift intervals, mSPRT always-valid p-values, peeking simulation, NDCG/MRR, team-draft interleaving with an exact binomial test, CSV analysis CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "D L Narayana" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "setuptools>=68"]

[project.urls]
Homepage = "https://abkit.vercel.app"
Repository = "https://github.com/D-L-Narayana/abkit"

[project.scripts]
abkit = "abkit.cli:main"

[tool.setuptools.packages.find]
include = ["abkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["abkit"]
disallow_untyped_defs = true
ignore_missing_imports = true
