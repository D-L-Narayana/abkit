[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "1.0.0"
description = "A/B-testing and search-ranking evaluation toolkit for travel experiments: z/t tests, sample size, SRM, CUPED, peeking simulation, NDCG/MRR, team-draft interleaving."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "D L Narayana" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
abkit = "abkit.cli:main"

[tool.setuptools.packages.find]
include = ["abkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
